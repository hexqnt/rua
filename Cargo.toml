[package]
name = "rua"
version = "0.1.3"
edition = "2024"
authors = ["hexqnt <hexqntlab@gmail.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hexqnt/rua"
homepage = "https://rua.hexq.ru"
readme = "Readme.md"
description = "CLI to download DeepStateMap history and render territory change charts with forecast"
keywords = ["russia", "ukraine", "territory", "chart", "forecast", "cli"]
categories = ["command-line-utilities"]

[features]
default = ["cli"]
cli = [
    "dep:argmin",
    "dep:argmin-math",
    "dep:clap",
    "dep:csv",
    "dep:flate2",
    "dep:itertools",
    "dep:maud",
    "dep:minify-html",
    "dep:plotly",
    "dep:toml",
    "dep:tqdm",
    "dep:tracing-subscriber",
    "chrono/serde",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[[bin]]
name = "rua"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
argmin = { version = "0.11.0", optional = true }
argmin-math = { version = "0.5", features = ["vec"], optional = true }
bytes = "1.12"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"], optional = true }
csv = { version = "1.4", optional = true }
flate2 = { version = "1.1", optional = true }
futures = "0.3"
itertools = { version = "0.15", optional = true }
maud = { version = "0.27.0", optional = true }
minify-html = { version = "0.18.1", optional = true }
plotly = { version = "0.14", optional = true }
pin-project-lite = "0.2"
reqwest = { version = "0.13.4", features = ["brotli", "zstd", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", features = ["time"] }
toml = { version = "1.1.4", optional = true }
tqdm = { version = "0.8", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
