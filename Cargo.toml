[package]
name = "rua"
version = "0.1.3"
edition = "2024"
authors = ["hexqnt <hexqntlab@gmail.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/hexqnt/rua"
homepage = "https://rua.hexq.ru"
readme = "Readme.md"
description = "CLI to download DeepStateMap history and render territory change charts with forecast"
keywords = ["russia", "ukraine", "territory", "chart", "forecast", "cli"]
categories = ["command-line-utilities"]

[dependencies]
argmin = "0.11.0"
argmin-math = { version = "0.5", features = ["vec"] }
bytes = "1.12"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4"
flate2 = "1.1"
futures = "0.3"
itertools = "0.15"
maud = "0.27.0"
minify-html = "0.18.1"
plotly = "0.14"
reqwest = { version = "0.13.4", features = ["socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.4"
tqdm = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
